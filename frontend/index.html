<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Command Center</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <main class="app">

    <header class="header">
      <div>
        <h1>AI Command Center</h1>
        <p>Phase 0 · Command Interface</p>
      </div>

      <span id="status" class="status">
        Checking...
      </span>
    </header>

    <section class="command-card">

      <label for="command">
        What should I do?
      </label>

      <textarea
        id="command"
        placeholder="Type a command..."
        rows="5"
      ></textarea>

      <button id="execute">
        Execute
      </button>

    </section>

    <section class="output-card">

      <h2>System Response</h2>

      <pre id="output">Waiting for command...</pre>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
