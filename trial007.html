<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trial 007</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #e0f2fe, #f5f3ff);
      text-align: center;
    }
    main {
      width: min(100%, 560px);
      padding: 40px 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(30, 41, 59, .12);
    }
    h1 { margin-top: 0; font-size: clamp(2.4rem, 8vw, 4rem); }
    p { color: #536078; line-height: 1.6; }
    button {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <main>
    <h1>Hello 👋</h1>
    <p>Welcome to Trial 007 — a simple little website made with HTML and CSS.</p>
    <p>Clean design. Friendly vibes. Just getting started!</p>
    <button onclick="document.getElementById('message').textContent = 'Nice! The button works 🎉'">Click me</button>
    <p id="message" aria-live="polite"></p>
  </main>
</body>
</html>
